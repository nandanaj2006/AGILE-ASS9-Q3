apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-portal-deployment
  labels:
    app: hospital-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hospital-portal
  template:
    metadata:
      labels:
        app: hospital-portal
    spec:
      containers:
      - name: hospital-portal
        image: DOCKER_IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-portal-service
spec:
  type: NodePort
  selector:
    app: hospital-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
